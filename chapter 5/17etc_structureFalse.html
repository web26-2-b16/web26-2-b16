<!DOCTYPE html>
<html lang="KO">

<head>
    <meta charset="UTF-8">

    <title>3. 구조 선택자</title>
    <style>
        /*모든 a태그에 빨간색이 적용?
        => li태그의 첫 번째 자손에 해당하는 a태그를 선택했으므로, a태그 5개가 전부 이 조건에 해당됨.*/
        li>a:first-child {
            color: red;
        }

        /*올바른 수정 : 첫번째 a태그에만 빨간색 적용*/
        li:first-child>a {
            color: red;
        }
    </style>
</head>

<body>
    <ul>
        <li><a href="#">주의 사항</a></li>
        <li><a href="#">주의 사항</a></li>

        <li>
            <a href="#">주의 사항1</a>
            <a href="#">주의 사항2</a>
        </li>
        <li><a href="#">주의 사항</a></li>
        <li><a href="#">주의 사항</a></li>
    </ul>

</body>

</html>
