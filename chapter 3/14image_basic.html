<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>14image_basic</title>
</head>
<body>
    <h2>이미지 삽입하기</h2>
    <img src="Penguins.jpg" alt="펭귄" width="300">
    <img src="Nothing" alt="그림이 존재하지 않습니다." width="300">
    <img src="명지전문대 로고.jpg" alt="명지전문대 로고" width="300">
    <img src=" https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSh6EajnIg5-zgJ36WbjnddO97rMETr6wQXgn-Mpyp3iw&s=10" alt="우주" width="300">

    <h2>음악 삽입하기</h2>
    <audio src="Kalimba.mp3" controls="controls"></audio>

    <h2>웹 브라우저 제약이 없도록 음악 삽입</h2>
    <audio controls="controls">
        <source src="Kalimba.mp3" type="audio/mp4">
        <source src="Kalimba.ogg" type="audio/ogg">
    </audio>

    <h2>동영상 삽입하기</h2>
    <video controls="controls">
        <source src="Wildlife.mp4" type="video/mp4">
        <source src="Wildlife.webm" type="video/webm">
    </video>

    <h2>동영상 불러오는 동안 다른 이미지 보여주기</h2>
    <video controls="controls" poster="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbfJ6oeZmYqgMrI3KXZPxr-cOOE8il4GpxLdgO9DadyQ&s=10">
        <source src="Wildlife.mp4" type="video/mp4">
        <source src="Wildlife.webm" type="video/webm">
    </video>

</body>
</html>
