<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>7.그림자와 그레이디언트 속성</title>
    <style>
        h1 {
            /* text-shadow: 5px 5px 5px black;
        border: 3px solid black; */
            /* box-shadow: 10px 10px 30px black;
        text-shadow: 5px 5px 5px black; */
            border: 3px solid black;
            box-shadow: 10px 10px 10px black, 10px 10px 20px orange, 10px 10px 30px red;
            text-shadow: 10px 10px 10px black, 10px 10px 20px orange, 10px 10px 30px red;
        }

        div {
            font-family: 'Times New Roman';
            height: 60px;
            line-height: 60px;
            text-align: center;

            /* 복사해서 붙여 넣으세요 */
            /* Permalink - use to edit and share this gradient: https://colorzilla.com/gradient-editor/#1e5799+0,2989d8+50,207cca+62,7db9e8+100 */
            background: linear-gradient(to bottom, #1e5799 0%, #2989d8 50%, #207cca 62%, #7db9e8 100%);
            /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */

        }
    </style>
</head>

<body>
    <h2>7.7. 그림자와 그레이디언트 속성</h2>
    <h3>1. text-shadow 속성</h3>
    <h3>2. box-shadow 속성</h3>

    <hr>
    <h1>Lorem, ipsum dolor sit amet consectetur adipisicing elit.</h1>

    <hr>
    <p>이 문장은 그림자가 있습니다.</p>
    <div class="box">
        <h1>이 요소는 그림자가 있습니다.</h1>
    </div>

    <hr>
    <div class="gradient">
        <h1>CSS3 그레이디언트</h1>
    </div>
</body>

</html>
