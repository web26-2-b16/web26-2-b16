<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
    <script>
        //변수 선언
        let date = new Date();
        let hours = date.getHours();

        //조건문
        if (hours < 12) {
            //표현식 "hours < 12"가 참일 때 실행
            alert('오전입니다.');
        }
        
        else {
            //표현식 "hours < 12"가 거짓일 때 실행
            alert('오후입니다.');
        }
    </script>
</head>
<body>
        if else조건문으로 오전과 오후 구분하기<hr>

    <h3>3. 조건문과 반복문</h3>
    <h5>    1_조건문</h5>
    <h5>    2_반복문</h5>
</body>
</html>
